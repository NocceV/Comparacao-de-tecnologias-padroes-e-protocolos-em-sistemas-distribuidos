global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  #########REST#########

  - job_name: 'user_rest'
    metrics_path: /metrics
    static_configs:
      - targets: ['user-rest:8002']

  - job_name: 'message_rest'
    metrics_path: /metrics
    static_configs:
      - targets: ['message-rest:8012']

  - job_name: 'event_rest'
    metrics_path: /metrics
    static_configs:
      - targets: ['event-rest:8022']

  #########GaphQL#########

  - job_name: 'user_graphql'
    metrics_path: /metrics
    static_configs:
      - targets: ['user-graphql:8001']

  - job_name: 'message_graphql'
    metrics_path: /metrics
    static_configs:
      - targets: ['message-graphql:8011']

  - job_name: 'event_graphql'
    metrics_path: /metrics
    static_configs:
      - targets: ['event-graphql:8021']

  #########WebHook#########

  - job_name: 'user_webhook'
    metrics_path: /metrics
    static_configs:
      - targets: ['user-webhook:8003']

  - job_name: 'message_webhook'
    metrics_path: /metrics
    static_configs:
      - targets: ['message-webhook:8004']

  - job_name: 'event_webhook'
    metrics_path: /metrics
    static_configs:
      - targets: ['event-webhook:8023']

  #########WebSocket#########

  - job_name: 'user_websocket'
    metrics_path: /metrics
    static_configs:
      - targets: ['user-websocket:8005']

  - job_name: 'message_websocket'
    metrics_path: /metrics
    static_configs:
      - targets: ['message-websocket:8015']

  - job_name: 'event_websocket'
    metrics_path: /metrics
    static_configs:
      - targets: ['event-websocket:8025']

  #########GRPC#########

  - job_name: 'user_grpc'
    metrics_path: /metrics
    static_configs:
      - targets: ['user-grpc:50052']

  - job_name: 'message_grpc'
    metrics_path: /metrics
    static_configs:
      - targets: ['message-grpc:50053']

  - job_name: 'event_grpc'
    metrics_path: /metrics
    static_configs:
      - targets: ['event-grpc:50062']

