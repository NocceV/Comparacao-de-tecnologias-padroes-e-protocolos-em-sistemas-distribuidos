version: "3.8"

# ---------------------------------------------------------------------------
# LIMITES DE RECURSOS IDÊNTICOS PARA OS 21 MICROSSERVIÇOS EXPERIMENTAIS
# Todos os serviços (3 domínios x 7 tecnologias) recebem exatamente a mesma
# cota de CPU e memória, garantindo paridade de infraestrutura entre as
# tecnologias comparadas. Alterar apenas aqui para mudar a cota de todos.
#   cpus         : 0,50 vCPU (CFS quota = 50 ms a cada 100 ms)
#   mem_limit    : 256 MiB de RAM
#   memswap_limit: 256 MiB (= mem_limit => swap desabilitado)
#   pids_limit   : 256 processos/threads
# Prometheus e Grafana (infraestrutura de observação, fora da comparação)
# possuem limites próprios e não competem pelos recursos dos serviços.
# ---------------------------------------------------------------------------
x-service-limits: &service-limits
  cpus: "0.50"
  mem_limit: 256m
  memswap_limit: 256m
  pids_limit: 256

services:

  #########REST#########

  user-rest:
    build: ../python/services/user-service/user-service-rest
    image: user-rest:dev
    container_name: user-rest
    <<: *service-limits
    ports:
      - "8002:8002"
    networks:
      - testnet

  message-rest:
    build: ../python/services/message-service/message-service-rest
    image: message-rest:dev
    container_name: message-rest
    <<: *service-limits
    ports:
      - "8012:8012"
    networks:
      - testnet

  event-rest:
    build: ../python/services/event-service/event-service-rest
    image: event-rest:dev
    container_name: event-rest
    <<: *service-limits
    ports:
      - "8022:8022"
    networks:
      - testnet

  #########GaphQL#########

  user-graphql:
    build: ../python/services/user-service/user-service-graphql
    image: user-graphql:dev
    container_name: user-graphql
    <<: *service-limits
    ports:
      - "8001:8001"   
    networks:
      - testnet

  message-graphql:
    build: ../python/services/message-service/message-service-graphql
    image: message-graphql:dev
    container_name: message-graphql
    <<: *service-limits
    ports:
      - "8011:8011"
    networks:
      - testnet

  event-graphql:
    build: ../python/services/event-service/event-service-graphql
    image: event-graphql:dev
    container_name: event-graphql
    <<: *service-limits
    ports:
      - "8021:8021"
    networks:
      - testnet

  #########GRPC#########

  user-grpc:
    build: ../python/services/user-service/user-service-grpc
    image: user-grpc:dev
    container_name: user-grpc
    <<: *service-limits
    ports:
      - "50051:50051"     
      - "50052:50052"     
    networks:
      - testnet

  message-grpc:
    build: ../python/services/message-service/message-service-grpc
    image: message-grpc:dev
    container_name: message-grpc
    <<: *service-limits
    ports:
      - "50054:50054"
      - "50053:50053"
    networks:
      - testnet

  event-grpc:
    build: ../python/services/event-service/event-service-grpc
    image: event-grpc:dev
    container_name: event-grpc
    <<: *service-limits
    ports:
      - "50061:50061"
      - "50062:50062"
    networks:
      - testnet

  #########WebHook#########

  user-webhook:
    build: ../python/services/user-service/user-service-webhook
    image: user-webhook:dev
    container_name: user-webhook
    <<: *service-limits
    ports:
      - "8003:8003"
    networks:
      - testnet

  message-webhook:
    build: ../python/services/message-service/message-service-webhook
    image: message-webhook:dev
    container_name: message-webhook
    <<: *service-limits
    ports:
      - "8004:8004"
    networks:
      - testnet

  event-webhook:
    build: ../python/services/event-service/event-service-webhook
    image: event-webhook:dev
    container_name: event-webhook
    <<: *service-limits
    ports:
      - "8023:8023"
    networks:
      - testnet

  #########WebSocket#########

  user-websocket:
    build: ../python/services/user-service/user-service-websocket
    image: user-websocket:dev
    container_name: user-websocket
    <<: *service-limits
    ports:
      - "8005:8005"
    networks:
      - testnet

  message-websocket:
    build: ../python/services/message-service/message-service-websocket
    image: message-websocket:dev
    container_name: message-websocket
    <<: *service-limits
    ports:
      - "8015:8015"
    networks:
      - testnet

  event-websocket:
    build: ../python/services/event-service/event-service-websocket
    image: event-websocket:dev
    container_name: event-websocket
    <<: *service-limits
    ports:
      - "8025:8025"
    networks:
      - testnet

  #########SOAP#########

  user-soap:
    build: ../python/services/user-service/user-service-soap
    image: user-soap:dev
    container_name: user-soap
    <<: *service-limits
    ports:
      - "8006:8006"
    networks:
      - testnet

  message-soap:
    build: ../python/services/message-service/message-service-soap
    image: message-soap:dev
    container_name: message-soap
    <<: *service-limits
    ports:
      - "8016:8016"
    networks:
      - testnet

  event-soap:
    build: ../python/services/event-service/event-service-soap
    image: event-soap:dev
    container_name: event-soap
    <<: *service-limits
    ports:
      - "8026:8026"
    networks:
      - testnet
  #########SSE#########

  user-sse:
    build: ../python/services/user-service/user-service-sse
    image: user-sse:dev
    container_name: user-sse
    <<: *service-limits
    ports:
      - "8007:8007"
    networks:
      - testnet

  message-sse:
    build: ../python/services/message-service/message-service-sse
    image: message-sse:dev
    container_name: message-sse
    <<: *service-limits
    ports:
      - "8017:8017"
    networks:
      - testnet

  event-sse:
    build: ../python/services/event-service/event-service-sse
    image: event-sse:dev
    container_name: event-sse
    <<: *service-limits
    ports:
      - "8027:8027"
    networks:
      - testnet

  #########Metric and Health#########

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    cpus: "1.00"
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - testnet

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    cpus: "1.00"
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - testnet
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

networks:
  testnet:
    driver: bridge

